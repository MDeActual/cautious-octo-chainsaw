name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Use supported Codex model
        shell: bash
        run: |
          echo "COPILOT_AGENT_MODEL=sweagent-capi:gpt-5.3-codex" >> "$GITHUB_ENV"
